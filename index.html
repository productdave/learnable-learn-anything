<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Foundations for PM | Product Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css?v=4">
  <link rel="stylesheet" href="styles/base.css?v=4">
  <link rel="stylesheet" href="styles/components.css?v=4">
  <link rel="stylesheet" href="styles/themes.css?v=4">
</head>
<body>
  <div id="icons" style="display:none"></div>
  <div id="app" class="app">
    <header class="app-header">
      <div class="header-left">
        <button class="header-btn mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle menu">
          <svg width="20" height="20"><use href="#icon-menu"/></svg>
        </button>
        <a href="#/" class="header-logo">
          <div class="header-pa-mark">
            <svg viewBox="0 0 72 72" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="35.7725" cy="35.7725" r="35.7725" fill="#FFE028"/>
              <path d="M48.7373 22.6593C46.4912 20.9385 43.8808 20.002 37.3512 20.002H25.6543V26.8242H37.7179C39.6508 26.8242 41.4233 26.979 42.9921 27.8089C44.5073 28.5399 45.6584 30.1516 45.6584 32.6008C45.6584 35.05 44.5073 36.7631 43.0965 37.4915C41.5303 38.3266 39.8062 38.4814 38.0286 38.4814H25.6543V58.5319H33.4344V45.296H38.1839C43.8299 45.296 46.4402 44.3595 49.0531 42.2275C51.5056 40.2504 53.1278 36.2911 53.1278 32.4916C53.1278 28.6922 51.559 24.946 48.7373 22.6593Z" fill="black"/>
            </svg>
          </div>
          <div class="header-logo-text">
            <span class="header-logo-brand">Product Academy</span>
            <span class="header-logo-sub">AI PM Course</span>
          </div>
        </a>
      </div>
      <div class="header-right">
        <button class="header-search" id="search-trigger" aria-label="Search">
          <svg width="16" height="16"><use href="#icon-search"/></svg>
          <span>Search...</span>
          <kbd>/</kbd>
        </button>
        <button class="header-btn" id="flashcard-trigger" aria-label="Flashcards" title="Flashcard Review">
          <svg width="20" height="20"><use href="#icon-cards"/></svg>
        </button>
        <button class="header-btn" id="chat-trigger" aria-label="AI Tutor" title="AI Learning Assistant">
          <svg width="20" height="20"><use href="#icon-sparkle"/></svg>
        </button>
        <button class="header-btn" id="theme-toggle" aria-label="Toggle theme">
          <svg width="20" height="20" class="theme-icon-light"><use href="#icon-moon"/></svg>
          <svg width="20" height="20" class="theme-icon-dark" style="display:none"><use href="#icon-sun"/></svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <aside class="app-sidebar" id="sidebar"></aside>
      <main class="app-main">
        <div class="app-main-inner" id="content"></div>
      </main>
    </div>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay" style="display:none">
    <div class="search-modal">
      <div class="search-input-wrap">
        <svg width="20" height="20"><use href="#icon-search"/></svg>
        <input type="text" id="search-input" placeholder="Search topics, concepts, tools..." autocomplete="off">
        <kbd>ESC</kbd>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- Flashcard overlay -->
  <div class="flashcard-overlay" id="flashcard-overlay" style="display:none"></div>

  <!-- Selection popup -->
  <div id="selection-popup">
    <svg width="13" height="13"><use href="#icon-sparkle"/></svg>
    Ask AI
  </div>

  <!-- Chat panel -->
  <div id="chat-panel">
    <div class="chat-header">
      <div class="chat-header-title">
        <svg width="16" height="16"><use href="#icon-sparkle"/></svg>
        AI Learning Assistant
      </div>
      <div class="chat-header-actions">
        <button class="chat-header-btn chat-new-btn" title="New conversation">
          <svg width="15" height="15"><use href="#icon-rotate"/></svg>
        </button>
        <button class="chat-header-btn chat-settings-btn" title="Set API key">
          <svg width="15" height="15"><use href="#icon-save"/></svg>
        </button>
        <button class="chat-header-btn chat-close-btn" title="Close">
          <svg width="15" height="15"><use href="#icon-x"/></svg>
        </button>
      </div>
    </div>
    <div class="chat-messages"></div>
    <div class="chat-footer">
      <div class="chat-input-row">
        <textarea class="chat-input" placeholder="Ask a follow-up question… (Enter to send)" rows="2"></textarea>
        <button class="chat-send-btn" title="Send">
          <svg width="15" height="15"><use href="#icon-send"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
