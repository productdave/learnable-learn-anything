<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 732" role="img"><title>From a sentence to labeled values</title><rect width="600" height="732" rx="22" fill="#F0FDFA"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#134E4A">From a sentence to labeled values</text><text x="28" y="120" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#475569">JSON makes the interpretation inspectable.</text><rect x="28" y="175" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="208" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">“THAI WOULD BE NICE”</text><text x="48" y="243" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">cuisine_preferences → [&quot;Thai&quot;]</text><text x="286" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="329" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="362" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">“UNDER $25”</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">budget_amount → 25</text><text x="286" y="479" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="483" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">NOT MENTIONED</text><text x="48" y="551" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">dietary_restrictions → null</text><text x="28" y="677" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">null means unknown. An empty list means</text><text x="28" y="703" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">explicitly none in our format.</text></svg>