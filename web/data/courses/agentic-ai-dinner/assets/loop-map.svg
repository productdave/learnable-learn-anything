<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1040" role="img"><title>Build a loop you can explain</title><rect width="600" height="1040" rx="22" fill="#F0FDFA"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#134E4A">Build a loop you can explain</text><text x="28" y="120" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#475569">Repeat when the user clarifies.</text><rect x="28" y="175" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="208" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">1 · READ</text><text x="48" y="243" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Receive the dinner request.</text><text x="286" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="329" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="362" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">2 · EXTRACT</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Turn the request into labeled values.</text><text x="286" y="479" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="483" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">3 · VALIDATE</text><text x="48" y="551" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Check structure and meaning.</text><text x="286" y="633" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="637" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="670" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">4 · CLARIFY</text><text x="48" y="705" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Ask one useful question.</text><text x="286" y="787" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="791" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="824" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">5 · UPDATE</text><text x="48" y="859" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Preserve earlier requirements.</text><text x="28" y="985" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">A correction updates the relevant field. Keep</text><text x="28" y="1011" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">the rest of the request intact.</text></svg>