<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 732" role="img"><title>Where did the answer come from?</title><rect width="600" height="732" rx="22" fill="#F0FDFA"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#134E4A">Where did the answer come from?</text><text x="28" y="120" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#475569">Each input has a different job.</text><rect x="28" y="175" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="208" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">INSTRUCTIONS</text><text x="48" y="243" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Extract preferences.</text><text x="48" y="271" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Keep unknowns visible.</text><text x="286" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="329" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="362" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">USER REQUEST</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Spicy, under $25.</text><text x="48" y="425" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Thai would be nice.</text><text x="286" y="479" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#0F766E">↓</text><rect x="28" y="483" width="544" height="132" rx="14" fill="white" stroke="#99D9CF"/><text x="48" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0F766E">EXTERNAL EVIDENCE</text><text x="48" y="551" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Current menus and charges</text><text x="48" y="579" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#18302D">Only if actually supplied</text><text x="28" y="677" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">Inputs inform the response. Wording alone does</text><text x="28" y="703" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">not verify a fact.</text></svg>